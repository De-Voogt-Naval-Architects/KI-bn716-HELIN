[project]
name = "datalogger-extractor"
version = "0.1.0"
description = "Extract Rhodium DataLogger trends over gRPC to CSV on the Helin edge (bn716)"
authors = [{ name = "De Voogt Naval Architects" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "grpcio==1.83.0",
    # Must satisfy the stubs generated by grpcio-tools below (it pins protobuf 7).
    "protobuf>=7.35.1,<8",
    "helin-edge-sdk==0.0.2",
]

[tool.poetry]
package-mode = false

# Poetry 2.1 (pinned in the Dockerfile) does not read PEP 735 [dependency-groups].
[tool.poetry.group.dev.dependencies]
pytest = ">=8"
grpcio-tools = "1.83.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
