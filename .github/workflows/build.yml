# Build check: makes sure the module image still builds for every target architecture
# Triggered on each PR and push to main 

# ONLY BUILDS - nothing is pushed or published, no secrets are needed.

name: Build module image

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry==2.1.3
      - run: poetry install --with dev --no-root
      - run: poetry run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build the module image (no push)
        # linux/arm/v7 dropped (grpcio may need a source build there under QEMU);
        # add it back here and in publish.yml if a 32-bit ARM node needs it.
        run: docker buildx build --platform linux/amd64,linux/arm64 ./module
