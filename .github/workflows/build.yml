# Build check: makes sure the module image still builds for every target architecture
# Triggered on each PR and push to main 

# ONLY BUILDS - nothing is pushed or published, no secrets are needed.

name: Build module image

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build the module image (no push)
        run: docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 ./module
