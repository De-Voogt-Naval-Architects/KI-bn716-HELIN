# Dev edge node for the DataLogger extractor - mirrors the bn716 node.
#
#   extractor            the module image with the node template's flags, reading the REAL
#                        DataLoggerGRPC.exe on the Windows PC (SSH reverse tunnel on the VM's
#                        127.0.0.1:50715) and the test tag list at /config/tags. Host network,
#                        so it reaches the tunnel; HDC via its published port 127.0.0.1:6684.
#                        Profile "extractor": started by devnode.ps1 run / outage-real.sh.
#   helindatacollector   HDC stand-in: HTTPS input, local buffer, independent north outputs:
#                          cloud     -> cloud-hdc over HTTPS (retries/queues when offline)
#                          timescale -> TimescaleDB, flatmap rows in public.readings
#   cloud-hdc            the shore side (Cloud HDC). Cutting its network = no internet on board.
#   timescaledb          as the Helin TimescaleDB app on the node (module TimescaleDB)
#   grafana              as Helin Grafana on the node, :3000, datasource + repo dashboards
#   mosquitto, gateway   portal direct methods (curl health on :8080)
#   fake-datalogger      synthetic logger, only with --profile fake
#   tools                poetry lock + proto stubs + pytest (profile "tools")
#
# devnode.ps1 puts the tag list in ./config/tags and a self-signed cert in ./certs.

name: helin-devnode

services:
  extractor:
    profiles: ["extractor"]
    build: ../module
    image: datalogger-extractor:dev
    network_mode: host
    # = module_metadata.json Cmd; the address is the tunnel to the real logger and the
    # logger holds history, so this copies one past day (range) instead of following now.
    command:
      - --addr
      - ${DATALOGGER_ADDR:-127.0.0.1:50715}
      - --signals
      - /config/tags
      - --rate
      - "1000"
      - --dest-type
      - http
      - --dest-addr
      - https://127.0.0.1:6684/sensor-reading
      - --insecure
      - --mode
      - ${TEST_MODE:-range}
      - --start
      - ${TEST_START:-2026-04-29 00:00:00}
      - --end
      - ${TEST_END:-2026-04-30 00:00:00}
      - --chunk-minutes
      - "60"
      - --on-finish
      - idle
    environment:
      LOCAL_MQTT_HOST: 127.0.0.1
    volumes:
      - ./config:/config:ro
      - extractor-state:/data/out
    restart: unless-stopped

  helindatacollector:
    build:
      context: ..
      dockerfile: devnode/fakehdc/Dockerfile
    image: fake-hdc:dev
    command: ["--port", "6684", "--cert", "/certs/hdc-cert.pem", "--key", "/certs/hdc-key.pem",
              "--timescale", "timescaledb:5432/helindb",
              "--cloud-url", "https://cloud-hdc:6684/sensor-reading"]
    environment:
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-helin-dev}
    networks:
      default:
        aliases: [HelinDataCollector]
    ports:
      - "6684:6684"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  cloud-hdc:
    image: fake-hdc:dev
    command: ["--port", "6684", "--cert", "/certs/hdc-cert.pem", "--key", "/certs/hdc-key.pem",
              "--name", "Cloud HDC", "--no-cloud"]
    volumes:
      - ./certs:/certs:ro
    depends_on: [helindatacollector]
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: helindb
      POSTGRES_USER: helin
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-helin-dev}
    networks:
      default:
        aliases: [TimescaleDB]
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helin -d helindb"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-helin-dev}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-helin-dev}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/datalogger-hdc.dashboard.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"     # for the host-network extractor's portal link
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      MQTT_HOST: mosquitto
    ports:
      - "8080:8080"
    depends_on: [mosquitto]
    restart: unless-stopped

  fake-datalogger:
    profiles: ["fake"]
    image: datalogger-extractor:dev
    entrypoint: ["python", "/devtests/fake_datalogger.py", "--port", "50052"]
    environment:
      PYTHONPATH: /app
    volumes:
      - ../module/tests:/devtests:ro
    restart: unless-stopped

  tools:
    profiles: ["tools"]
    image: python:3.12-slim
    working_dir: /work
    environment:
      PIP_CERT: /etc/ssl/certs/devnode-ca-bundle.crt
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../module:/work
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/devnode-ca-bundle.crt:ro
    entrypoint: ["sh", "-c"]
    command:
      - >-
        pip install -q poetry==2.1.3 &&
        poetry lock &&
        poetry install -q --with dev --no-root &&
        poetry run python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. Trending.proto &&
        poetry run pytest -q -p no:cacheprovider

volumes:
  extractor-state:
  timescale-data:
  grafana-data:
