# Dev edge node for the DataLogger extractor.
#
#   fake-datalogger  synthetic DataLoggerTrends gRPC server (module/tests/fake_datalogger.py)
#   extractor        the module image, built exactly as CI builds it, in follow mode
#   mosquitto        stands in for edgeHub (portal direct methods over MQTT)
#   gateway          the Helin edge-module-request API routes on :8080 (curl health)
#   tools            poetry lock + proto stubs + pytest (profile "tools")
#   real             the extractor against the real DataLoggerGRPC.exe on the Windows host
#                    (profile "real"; DATALOGGER_ADDR in devnode/.env)
#
# CSVs land in the named volumes; read them with `devnode.ps1 files`.

name: helin-devnode

x-extractor: &extractor
  build: ../module
  image: datalogger-extractor:dev
  restart: unless-stopped

services:
  fake-datalogger:
    image: datalogger-extractor:dev
    entrypoint: ["python", "/devtests/fake_datalogger.py", "--port", "50715"]
    environment:
      PYTHONPATH: /app            # the gRPC stubs live in the image's /app
    volumes:
      - ../module/tests:/devtests:ro
    restart: unless-stopped

  extractor:
    <<: *extractor
    command:
      - --addr=fake-datalogger:50715
      - --mode=follow
      - --rate=1
      - --interval=60
      - --lag=30
      - --backfill-minutes=30
      - --keep-days=7
    environment:
      LOCAL_MQTT_HOST: mosquitto
    volumes:
      - extractor-data:/data/out
    depends_on: [fake-datalogger, mosquitto]

  real:
    <<: *extractor
    profiles: ["real"]
    command:
      # devnode.ps1 fills DATALOGGER_ADDR with the Windows host as the VM sees it
      - --addr=${DATALOGGER_ADDR:?set DATALOGGER_ADDR}
      - --mode=${REAL_MODE:-range}
      - --start=${REAL_START:-2026-04-29 18:00:00}
      - --end=${REAL_END:-2026-04-29 18:10:00}
      - --rate=${REAL_RATE:-1}
      - --connect-attempts=${REAL_CONNECT_ATTEMPTS:-6}
      - --on-finish=exit
      - --force
    # Host network: reaches the Windows host directly, or 127.0.0.1:50715 when an
    # SSH reverse tunnel carries the port (see devnode.ps1 tunnel).
    network_mode: host
    volumes:
      - real-data:/data/out
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      MQTT_HOST: mosquitto
    ports:
      - "8080:8080"
    depends_on: [mosquitto]
    restart: unless-stopped

  tools:
    profiles: ["tools"]
    image: python:3.12-slim
    working_dir: /work
    environment:
      PIP_CERT: /etc/ssl/certs/devnode-ca-bundle.crt
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../module:/work
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/devnode-ca-bundle.crt:ro
    entrypoint: ["sh", "-c"]
    command:
      - >-
        pip install -q poetry==2.1.3 &&
        poetry lock &&
        poetry install -q --with dev --no-root &&
        poetry run python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. Trending.proto &&
        poetry run pytest -q -p no:cacheprovider

volumes:
  extractor-data:
  real-data:
